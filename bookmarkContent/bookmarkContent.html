<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Content</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="bookmarkcontent.css">
    <style>
        /* 퀵 버튼 스타일 추가 */
        .quick-btns { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .quick-btn {
            padding: 6px 12px; border-radius: 20px; border: 1px solid #eee;
            background: #fff; font-size: 12px; cursor: pointer; transition: all 0.2s;
        }
        .quick-btn.active { background-color: #3182F6; color: #fff; border-color: #3182F6; }
        .quick-btn:hover:not(.active) { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <header class="top-header">
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="/dashboard/dashboard.html">대시보드</a></li>
                <li class="active"><a href="../bookmark/bookmark.html">북마크 목록</a></li>
                <li><a href="/tag/tag.html">태그</a></li>
                <li><a href="/reminder/reminder.html">리마인드</a></li>
                <li><a href="/setting/setting.html">설정</a></li>
            </ul>
        </nav>
        <div class="search-container">
            <input type="text" placeholder="저장한 글, 태그 검색">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <main class="container">
        <div class="back-navigation">
            <a href="../bookmark/bookmark.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> 목록으로</a>
        </div>

        <div class="grid-layout">
            <section class="content-area card">
                <div class="thumbnail-placeholder" id="detailImageArea"></div>

                <div class="article-header">
                    <div class="title-row">
                        <h1 id="detailTitle">Loading...</h1>
                        <div class="action-buttons" style="display:flex; gap: 10px; align-items: center;">
                            <button id="mainEditBtn" style="padding: 8px 16px; border-radius: 20px; border: 1px solid #3182F6; background: #fff; color: #3182F6; cursor: pointer; font-weight: 600; font-size: 13px;">
                                수정하기
                            </button>
                            <button id="readStatusBtn" class="btn-read-status">
                                <i class="fa-solid fa-check"></i> <span>읽음</span>
                            </button>
                            <button class="btn-star" id="detailStarBtn"><i class="fa-regular fa-star"></i></button>
                        </div>
                    </div>
                    <div class="meta-row">
                        <span class="tag" id="detailTag">#Tag</span>
                        <span class="date" id="detailDate">0000.00.00</span>
                    </div>
                </div>

                <div class="article-body" id="detailContent">
                    <p>데이터를 불러오는 중입니다...</p>
                </div>
            </section>

            <aside class="sidebar">
                <div class="card ai-card">
                    <div class="card-title"><i class="fa-solid fa-wand-magic-sparkles"></i><h3>AI 요약 노트</h3></div>
                    <div class="card-content"><p id="detailAiSummary">요약 내용이 없습니다.</p></div>
                    <div class="card-footer"><button class="btn-light-blue" id="generateSummaryBtn">요약 생성하기</button></div>
                </div>

                <div class="card memo-card">
                    <div class="card-title"><h3>메모</h3></div>
                    <div class="card-content"><textarea id="detailMemo" readonly placeholder="메모를 입력하세요."></textarea></div>
                    <div class="card-footer"><button class="btn-light-blue" id="editMemoBtn">메모 수정하기</button></div>
                </div>

                <div class="card reminder-card">
                    <div class="card-title" style="display: flex; align-items: center; gap: 8px;">
                        <i class="fa-regular fa-bell" style="font-size: 18px;"></i> <h3>리마인더 설정</h3>
                    </div>
                    <div class="card-content">
                        <div id="reminderDisplay" style="margin-top: 12px;"></div>
                        <div id="reminderInputArea" style="display: none; margin-top: 10px;">
                            <div class="quick-btns">
                                <button type="button" class="quick-btn" id="btnTomorrow">내일</button>
                                <button type="button" class="quick-btn" id="btnWeekend">주말</button>
                                <button type="button" class="quick-btn" id="btnNextWeek">다음주</button>
                            </div>
                            <input type="datetime-local" id="reminderDateInput" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px;">
                        </div>
                    </div>
                    <div class="card-footer" style="margin-top: 15px; display: flex; gap: 8px;">
                        <button class="btn-light-blue" id="toggleReminderBtn">리마인더 설정</button>
                        <button class="btn-light-blue" id="saveReminderBtn" style="display: none; background-color: #3182F6; color: white;">저장</button>
                        <button class="btn-light-blue" id="deleteReminderBtn" style="display: none; background-color: #ff5252; color: white;">삭제</button>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <script src="bookmarkcontent.js"></script>
</body>
</html>
