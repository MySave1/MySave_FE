<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 처리 중...</title>
</head>
<body>
    <h2>로그인 처리 중입니다. 잠시만 기다려주세요...</h2>
    
    <script>
        // [설정] 백엔드 서버 주소 (배포 주소 또는 ngrok 주소)
        const API_BASE_URL = "http://localhost:8080"; 

        (async () => {
            // 1. URL에서 code 추출
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get("code");

            if (!code) {
                alert("잘못된 접근입니다. (인증 코드가 없습니다)");
                window.location.replace("../index/index.html"); // 메인으로 튕겨내기
                return;
            }

            try {
                // 2. 백엔드 API 호출 (코드를 주고 토큰을 받아옴)
                console.log("백엔드로 인증 코드 전송 중...", code);
                
                const response = await fetch(`${API_BASE_URL}/api/auth/kakao/callback?code=${code}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`서버 응답 오류: ${response.status}`);
                }

                // 3. 백엔드에서 준 JSON 데이터 받기 (여기서 토큰이 넘어옴)
                const data = await response.json();
                console.log("로그인 성공! 받은 데이터:", data);

                // 4. 토큰 저장 (백엔드 DTO 필드명 확인: accessToken이 맞는지)
                if (data.accessToken) {
                    // 1. 토큰 저장
                    localStorage.setItem("accessToken", data.accessToken);
    
                    // 2. 이름, 이메일도 미리 저장
                    localStorage.setItem("userName", data.name);
                    localStorage.setItem("userEmail", data.email);

                    alert(`${data.name}님 환영합니다!`); // 이름을 불러줄 수 있음
                    
                    // 5. 로그인 후 이동할 페이지 (예: 대시보드)
                    window.location.replace("../dashboard/dashboard.html");
                } else {
                    alert("토큰을 받아오지 못했습니다.");
                }

            } catch (error) {
                console.error("로그인 처리 실패:", error);
                alert("로그인 처리에 실패했습니다. 관리자에게 문의하세요.");
                window.location.replace("../index/index.html"); // 실패 시 메인으로
            }
        })();
    </script>
</body>
</html>
