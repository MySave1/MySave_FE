<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>로그인 처리 중...</title>
</head>
<body>
  <h2>로그인 처리 중입니다. 잠시만 기다려주세요...</h2>

  <script>
    const API_BASE_URL = "http://13.60.25.65:8080";

    (async () => {
      // 1) URL에서 code 추출 (카카오가 뒤에 붙여준 ?code=... 값)
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get("code");

      if (!code) {
        alert("잘못된 접근입니다.");
        // 실패 시 메인으로 이동 (경로 수정: 상위 폴더로 이동)
        window.location.replace("../index.html"); 
        return;
      }

      try {
        // 2) 백엔드에 code 전달 → 토큰 받기
        const response = await fetch(
          `${API_BASE_URL}/api/auth/kakao/callback?code=${encodeURIComponent(code)}`,
          {
            method: "GET",
            headers: { "Content-Type": "application/json" }
          }
        );

        if (!response.ok) {
            throw new Error(`서버 응답 오류: ${response.status}`);
        }

        // 3) 응답 JSON
        const data = await response.json();

        // 4) 저장 + 이동
        if (data.accessToken) {
          localStorage.setItem("accessToken", data.accessToken);
          localStorage.setItem("userName", data.name);
          localStorage.setItem("userEmail", data.email);
          localStorage.setItem("userId", data.userId);
          
          // 임시 저장한 닉네임이 있다면 덮어쓰기 (선택사항)
          const tempNick = localStorage.getItem("tempNickname");
          if(tempNick) localStorage.setItem("userName", tempNick);

          alert(`${data.name}님 환영합니다!`);
          
          window.location.replace("../dashboard/dashboard.html"); 
          
        } else {
          alert("로그인 정보가 없습니다.");
          window.location.replace("../index.html");
        }
      } catch (error) {
        console.error("로그인 처리 실패:", error);
        alert("로그인 처리에 실패했습니다.");
        window.location.replace("../index.html");
      }
    })();
  </script>
</body>
</html>
