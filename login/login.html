<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySave 로그인</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { 
        font-family: 'Pretendard', sans-serif; 
        background: #f0f2f5; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        margin: 0; 
    }
    .card { 
        background: white; 
        padding: 40px 30px; 
        border-radius: 16px; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
        text-align: center; 
        width: 100%;
        max-width: 360px; 
    }
    h2 { margin-top: 0; color: #333; margin-bottom: 24px; }
    
    .input-group { text-align: left; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #666; }
    input { 
        width: 100%; 
        padding: 12px; 
        border: 1px solid #ddd; 
        border-radius: 8px; 
        box-sizing: border-box; 
        font-size: 14px;
        transition: border-color 0.2s;
    }
    input:focus { border-color: #3b82f6; outline: none; }
    
    .btn { 
        background: #fee500; 
        color: #000;
        border: none; 
        width: 100%; 
        padding: 14px; 
        border-radius: 8px; 
        font-weight: 700; 
        font-size: 15px;
        cursor: pointer; 
        margin-top: 20px; 
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    
    .sub { margin-top: 16px; font-size: 12px; color: #888; }
    
    .loading { opacity: 0.6; pointer-events: none; }
  </style>
</head>

<body>
  <div class="card">
    <h2>계정 정보 설정</h2>

    <div class="input-group">
      <label>닉네임</label>
      <input type="text" id="inputNickname" placeholder="닉네임을 입력하세요">
    </div>

    <div class="input-group">
      <label>이메일</label>
      <input type="email" id="inputEmail" placeholder="example@mail.com">
    </div>

    <button class="btn" id="startKakaoLoginBtn" onclick="startKakaoFlow()">
        <i class="fa-solid fa-comment"></i> Kakao 계정으로 계속하기
    </button>
  </div>

  <script>
    const API_BASE_URL = "http://13.60.25.65:8080";

    async function startKakaoFlow() {
      const btn = document.getElementById('startKakaoLoginBtn');
      
      // 사용자 입력값 (API 전송용은 아니지만 UX상 입력 확인)
      // const nick = document.getElementById("inputNickname").value;
      // const email = document.getElementById("inputEmail").value;
      
      try {
        btn.classList.add('loading');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 연결 중...';

        // 1. 백엔드에서 카카오 로그인 URL 받아오기
        const response = await fetch(`${API_BASE_URL}/api/auth/kakao/login-url`);
        
        if (!response.ok) {
            throw new Error('로그인 URL을 받아오지 못했습니다.');
        }

        // 2. URL 텍스트 추출 (API 명세상 URL String이 반환됨)
        const kakaoLoginUrl = await response.text();

        // 3. 해당 URL로 브라우저 이동 -> 카카오 인증 화면 -> callback.html로 리다이렉트됨
        window.location.href = kakaoLoginUrl;

      } catch (error) {
        console.error("로그인 시작 실패:", error);
        alert("서버 연결에 실패했습니다. 다시 시도해주세요.");
        btn.classList.remove('loading');
        btn.innerHTML = '<i class="fa-solid fa-comment"></i> Kakao 계정으로 계속하기';
      }
    }
  </script>
</body>
</html>
